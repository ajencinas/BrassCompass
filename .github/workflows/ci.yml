name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch: a new push cancels the previous one still checking the old tree.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check — typecheck, scripts, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile every .adv script
        run: npm run test:scripts

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      # The itch.io blocker: a root-absolute /assets/… works on a domain root and 404s under
      # /html/<id>/. vite.config.ts builds with base: "./"; this keeps it that way.
      - name: Build is safe to host in a subdirectory
        run: |
          set -euo pipefail
          if grep -Eq '(src|href)="/' dist/index.html; then
            echo "::error file=dist/index.html::root-absolute URL in the built HTML; itch.io would serve it from /html/<id>/ and 404"
            grep -nE '(src|href)="/' dist/index.html
            exit 1
          fi
          if grep -Rq 'url(/' dist/assets/*.css; then
            echo "::error::root-absolute url() in the built CSS"
            exit 1
          fi
          grep -Eq '(src|href)="\./' dist/index.html
          echo "dist/index.html and its CSS use relative URLs."

  # Not part of a push or a pull request: the playthrough drives a real Chrome and needs the
  # painted art, which is gitignored and published separately. Run it by hand from Actions →
  # CI → Run workflow once the art folder is in place.
  browser:
    name: Browser playthrough (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: false

      - name: Is the art folder present?
        id: art
        run: |
          if [ -d public/assets/scenes ] && [ -d public/assets/characters ] && [ -d public/assets/props ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain what the browser job needs
        if: steps.art.outputs.present != 'true'
        run: |
          cat >&2 <<'EOF'
          The browser playthrough needs the painted art, which is not in git:
            public/assets/scenes/  public/assets/characters/  public/assets/props/
          Restore them (the owner's asset folder, or a private release artifact) and run this
          job again — Actions → CI → Run workflow. Until then, `npm run test:fast` and
          `npm run build` in the check job cover everything that does not need a browser.
          EOF
          exit 1

      - name: Play all four acts
        if: steps.art.outputs.present == 'true'
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test
