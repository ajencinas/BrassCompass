<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #070b14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070b14; }
      .o4-scene { position: absolute; inset: 0; overflow: hidden; }
      /* The harbour and the Marrow, as the night turns to dawn. */
      .o4-camera { position: absolute; inset: 0; overflow: hidden; transform-origin: 25% 40%; }
      .o4-dock { position: absolute; left: 0; top: 0; width: 3142px; height: 1080px; max-width: none; }
      /* Flag sixteen at the Marrow's masthead. */
      .o4-flag { position: absolute; left: 520px; top: 30px; width: 210px; transform-origin: 0% 50%; }
      /* Dawn: warm light washing down over the blue. */
      .o4-dawn { position: absolute; inset: 0; mix-blend-mode: screen;
        background: linear-gradient(to bottom, rgba(255, 160, 110, .62) 0%, rgba(255, 196, 140, .38) 40%, rgba(255, 214, 170, .08) 72%, rgba(255, 214, 170, 0) 100%); }
      .o4-sun { position: absolute; left: 820px; top: 380px; width: 520px; height: 260px; border-radius: 50%; filter: blur(60px); mix-blend-mode: screen;
        background: radial-gradient(ellipse at 50% 60%, rgba(255, 214, 150, .9) 0%, rgba(255, 170, 110, .45) 45%, rgba(255, 150, 100, 0) 100%); }
      .o4-shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(7, 11, 20, 0) 40%, rgba(7, 11, 20, .86) 100%); }
      .o4-title { position: absolute; left: 50%; bottom: 120px; width: 1500px; margin-left: -750px; text-align: center; font-family: "EB Garamond", Georgia, serif; }
      .o4-kicker { display: block; color: #e8c98a; font-size: 30px; letter-spacing: .5em; padding-left: .5em; }
      .o4-rule { width: 120px; height: 2px; margin: 22px auto 26px; background: #e8c98a; opacity: .7; }
      .o4-entry { position: relative; display: inline-block; }
      .o4-line { display: inline-block; color: #f0e8d6; font-size: 68px; font-weight: 400; font-style: italic; line-height: 1.15; letter-spacing: .01em;
        text-shadow: 0 2px 18px rgba(0, 0, 0, .6); white-space: nowrap; }
      /* The harbour stamp, coming down beside the entry. */
      .o4-stamp { position: absolute; right: -230px; top: -30px; width: 190px; height: 190px; border-radius: 50%; border: 6px solid rgba(150, 96, 196, .9);
        color: rgba(170, 116, 214, .95); font-family: Georgia, serif; font-size: 18px; letter-spacing: .06em; line-height: 1.3;
        display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(-12deg);
        box-shadow: inset 0 0 0 6px rgba(7, 11, 20, .0), inset 0 0 0 10px rgba(150, 96, 196, .55); }
      .o4-black { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="act4outro" data-start="0" data-duration="10" data-fps="30" data-width="1920" data-height="1080">
      <section id="o4-scene" class="clip o4-scene" data-start="0" data-duration="10" data-track-index="0" data-track-kind="graphics">
        <div class="o4-camera" data-layout-allow-overflow>
          <img class="o4-dock" src="assets/dock.webp" />
          <img class="o4-flag" src="assets/flag16.png" />
        </div>
        <div class="o4-sun" data-layout-allow-overflow></div>
        <div class="o4-dawn"></div>
        <div class="o4-shade"></div>
        <div class="o4-title">
          <span class="o4-kicker">ALL HANDS RETURNED</span>
          <div class="o4-rule"></div>
          <div class="o4-entry">
            <p class="o4-line">ARCADIA: returned. All hands.</p>
            <div class="o4-stamp" data-layout-allow-overflow>HARBOUR<br />OF<br />PORT VELA</div>
          </div>
        </div>
        <div class="o4-black" data-layout-allow-overlap></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".o4-camera", { scale: 1.1 }, { scale: 1.0, duration: 10, ease: "none" }, 0);
      tl.fromTo(".o4-black", { opacity: 1 }, { opacity: 0, duration: 1.0, ease: "power1.out" }, 0);
      // Night turns to dawn over the harbour.
      tl.fromTo(".o4-dawn", { opacity: 0 }, { opacity: 1, duration: 5.5, ease: "sine.inOut" }, 0.3);
      tl.fromTo(".o4-sun", { opacity: 0, y: 40 }, { opacity: 0.85, y: 0, duration: 6, ease: "sine.out" }, 0.8);
      // Flag sixteen stirs at the masthead.
      tl.fromTo(".o4-flag", { scaleY: 0.92, skewY: 2 }, { scaleY: 1.04, skewY: -2, duration: 1.0, ease: "sine.inOut", repeat: 9, yoyo: true }, 0);
      tl.fromTo(".o4-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 2.2);
      tl.fromTo(".o4-rule", { opacity: 0, scaleX: 0 }, { opacity: .7, scaleX: 1, duration: 0.9, ease: "power2.out" }, 2.4);
      // The entry, written left to right as if by hand.
      tl.fromTo(".o4-line", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 2.8, ease: "none" }, 3.0);
      // Then stamped.
      tl.fromTo(".o4-stamp", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.in" }, 6.3);
      tl.to(".o4-black", { opacity: 1, duration: 1.0, ease: "power1.in" }, 9.0);
      window.__timelines["act4outro"] = tl;
    </script>
  </body>
</html>
