<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #070b14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070b14; }
      .o3-scene { position: absolute; inset: 0; overflow: hidden; }
      /* The lagoon and the wreck, drawing back slowly to take in the boats. */
      .o3-camera { position: absolute; inset: 0; overflow: hidden; transform-origin: 55% 50%; }
      .o3-reef { position: absolute; left: -900px; top: 0; width: 3142px; height: 1080px; max-width: none; }
      /* Flag sixteen at the Arcadia's masthead. */
      .o3-flag { position: absolute; left: 1222px; top: 96px; width: 230px; transform-origin: 0% 50%; }
      /* The fog bank on the outer reef, thinning away. */
      .o3-fog { position: absolute; left: -200px; top: 330px; width: 2400px; height: 330px; border-radius: 50%; filter: blur(50px);
        background: radial-gradient(ellipse at 50% 50%, rgba(232, 236, 244, .95) 0%, rgba(220, 228, 240, .7) 55%, rgba(210, 220, 236, 0) 100%); }
      /* Boats crossing the lagoon toward the Needle. */
      .o3-boat { position: absolute; width: 120px; height: 40px; }
      .o3-cutter { position: absolute; left: 1660px; top: 440px; width: 110px; height: 120px; transform-origin: 50% 100%; }
      .o3-shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(7, 11, 20, 0) 45%, rgba(7, 11, 20, .8) 100%); }
      .o3-title { position: absolute; left: 50%; bottom: 140px; width: 1500px; margin-left: -750px; text-align: center; font-family: "EB Garamond", Georgia, serif; }
      .o3-kicker { display: block; color: #e8c98a; font-size: 30px; letter-spacing: .5em; padding-left: .5em; }
      .o3-rule { width: 120px; height: 2px; margin: 22px auto 26px; background: #e8c98a; opacity: .7; }
      .o3-line { color: #f0e8d6; font-size: 60px; font-weight: 400; font-style: italic; line-height: 1.15; letter-spacing: .01em; text-shadow: 0 2px 18px rgba(0, 0, 0, .6); }
      .o3-black { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="act3outro" data-start="0" data-duration="8" data-fps="30" data-width="1920" data-height="1080">
      <section id="o3-scene" class="clip o3-scene" data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics">
        <div class="o3-camera" data-layout-allow-overflow>
          <img class="o3-reef" src="assets/reef.webp" />
          <img class="o3-flag" src="assets/flag16.png" />
          <div class="o3-fog" data-layout-allow-overflow></div>
          <svg class="o3-cutter" viewBox="0 0 110 120" data-layout-allow-overlap>
            <path d="M52 4 L52 92 L12 92 Z" fill="#f4efe2" opacity=".95" />
            <path d="M58 18 L58 92 L96 92 Z" fill="#e6e0d2" opacity=".95" />
            <path d="M8 96 L102 96 L92 110 L20 110 Z" fill="#4a5056" />
          </svg>
          <svg class="o3-boat o3-b1" viewBox="0 0 120 40" style="left: 560px; top: 760px" data-layout-allow-overlap>
            <path d="M6 14 L114 14 L100 32 L20 32 Z" fill="#5a3a22" /><circle cx="40" cy="8" r="6" fill="#2b2622" /><circle cx="64" cy="8" r="6" fill="#2b2622" /><circle cx="86" cy="8" r="6" fill="#2b2622" />
            <path d="M30 18 L8 36 M92 18 L116 36" stroke="#3b2a1c" stroke-width="3" />
          </svg>
          <svg class="o3-boat o3-b2" viewBox="0 0 120 40" style="left: 700px; top: 850px" data-layout-allow-overlap>
            <path d="M6 14 L114 14 L100 32 L20 32 Z" fill="#6b4528" /><circle cx="36" cy="8" r="6" fill="#2b2622" /><circle cx="58" cy="8" r="6" fill="#2b2622" /><circle cx="80" cy="8" r="6" fill="#2b2622" /><circle cx="98" cy="8" r="6" fill="#2b2622" />
            <path d="M30 18 L8 36 M92 18 L116 36" stroke="#3b2a1c" stroke-width="3" />
          </svg>
          <svg class="o3-boat o3-b3" viewBox="0 0 120 40" style="left: 420px; top: 705px" data-layout-allow-overlap>
            <path d="M6 14 L114 14 L100 32 L20 32 Z" fill="#4e3320" /><circle cx="44" cy="8" r="6" fill="#2b2622" /><circle cx="70" cy="8" r="6" fill="#2b2622" />
            <path d="M30 18 L8 36 M92 18 L116 36" stroke="#3b2a1c" stroke-width="3" />
          </svg>
        </div>
        <div class="o3-shade"></div>
        <div class="o3-title">
          <span class="o3-kicker">TIDY WEATHER</span>
          <div class="o3-rule"></div>
          <p class="o3-line">Everybody rows for the Marrow. One sail runs for home.</p>
        </div>
        <div class="o3-black" data-layout-allow-overlap></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(".o3-camera", { scale: 1.12, x: -60 }, { scale: 1.0, x: 0, duration: 8, ease: "none" }, 0);
      tl.fromTo(".o3-black", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "power1.out" }, 0);
      // The fog comes down off the reef.
      tl.fromTo(".o3-fog", { opacity: 0.9, y: 0 }, { opacity: 0, y: 40, duration: 3.2, ease: "power2.inOut" }, 0.3);
      // The flag lifts and stirs in the breeze.
      tl.fromTo(".o3-flag", { scaleY: 0.92, skewY: 2 }, { scaleY: 1.04, skewY: -2, duration: 1.0, ease: "sine.inOut", repeat: 7, yoyo: true }, 0);
      // The boats pull away across the lagoon toward the Needle, bobbing as they go.
      tl.fromTo(".o3-b1", { x: 0 }, { x: -520, duration: 8, ease: "none" }, 0);
      tl.fromTo(".o3-b2", { x: 0 }, { x: -560, duration: 8, ease: "none" }, 0);
      tl.fromTo(".o3-b3", { x: 0 }, { x: -470, duration: 8, ease: "none" }, 0);
      tl.fromTo(".o3-boat", { y: 0 }, { y: 6, duration: 0.5, ease: "sine.inOut", repeat: 15, yoyo: true }, 0);
      // Cray's cutter heads for the horizon, shrinking.
      tl.fromTo(".o3-cutter", { x: 0, y: 0, scale: 1 }, { x: 110, y: -6, scale: 0.3, duration: 7.5, ease: "power1.in" }, 0.2);
      tl.fromTo(".o3-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 3.4);
      tl.fromTo(".o3-rule", { opacity: 0, scaleX: 0 }, { opacity: .7, scaleX: 1, duration: 0.9, ease: "power2.out" }, 3.6);
      tl.fromTo(".o3-line", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.1, ease: "power2.out" }, 3.8);
      tl.to(".o3-black", { opacity: 1, duration: 0.9, ease: "power1.in" }, 7.05);
      window.__timelines["act3outro"] = tl;
    </script>
  </body>
</html>
